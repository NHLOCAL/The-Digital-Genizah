name: Keep scheduled dataset workflows active

# GitHub automatically disables schedules in inactive public repositories
# after 60 days. Record maintenance activity on the default branch twice
# a month so the Otzaria and Ben-Yehuda imports keep being scheduled.
on:
  push:
    branches: [alonim]
    paths:
      - '.github/workflows/keep_schedules_active.yml'
  schedule:
    - cron: '41 4 1,20 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-schedule-keepalive
  cancel-in-progress: false

jobs:
  record-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6

      - name: Record maintenance activity
        run: |
          mkdir -p .github
          printf 'Last scheduled workflow maintenance (UTC): %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/workflow-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-activity.txt
          git commit -m "chore: keep scheduled dataset updates active"
          git push origin "HEAD:${GITHUB_REF_NAME}"
